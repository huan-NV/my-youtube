version: '3.8'

services:
  vietnamese-tts:
    build: .
    container_name: vietnamese-tts
    ports:
      - "5000:5000"
    volumes:
      - ./models:/app/models
      - ./output:/app/output
      - ./audio_samples:/app/audio_samples
    environment:
      - PYTHONUNBUFFERED=1
      - CUDA_VISIBLE_DEVICES=0  # Chỉ định GPU nếu có
    restart: unless-stopped
    
    # Uncomment nếu sử dụng GPU
