version: "3.8"

services:
  coqui-tts-vietnamese:
    build: .
    ports:
      - "5002:5002"
    volumes:
      - ./models:/app/models # Cache models
    environment:
      - PYTHONPATH=/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
